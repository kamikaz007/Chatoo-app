<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Chatoo Pro | Web3 Experience</title>

    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="config.js"></script>
    <script src="rpc.js"></script>
    <script src="auth.js"></script>
    <script src="app.js"></script>

    <style>
        :root { 
            --primary: #8257e5; 
            --gold: #ffd700; 
            --dark: #09090b; 
            --card-bg: rgba(20, 20, 20, 0.95);
            --border-color: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-secondary: #a0a0a0;
        }

        body, html { margin: 0; padding: 0; height: 100vh; background: var(--dark); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
        
        #lock-screen { position: fixed; inset: 0; z-index: 9999; background: radial-gradient(circle at center, #1a1a2e 0%, #09090b 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .card { background: rgba(255, 255, 255, 0.03); padding: 40px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); backdrop-filter: blur(15px); width: 85%; max-width: 350px; text-align: center; }
        
        .entry-btn { background: var(--primary); color: white; border: none; padding: 18px; border-radius: 15px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 20px rgba(130, 87, 229, 0.4); transition: 0.3s; }
        .entry-btn:disabled { background: #444; cursor: not-allowed; }
        .entry-btn:hover { background: #6e44c9; }

        .app-shell { display: none; flex-direction: column; height: 100vh; }
        #map-canvas { flex-grow: 1; filter: grayscale(0.2) brightness(0.6); position: relative; }

        header { position: absolute; top: 0; width: 100%; padding: 20px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; background: #ff4444; transition: 0.5s; }

        .search-container {
            position: absolute;
            top: 80px;
            left: 5%;
            right: 5%;
            z-index: 1000;
            display: flex;
            gap: 10px;
        }

        .search-input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 14px 20px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            backdrop-filter: blur(10px);
            outline: none;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.7);
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: var(--gold);
        }

        .places-panel {
            position: absolute;
            bottom: 30px;
            left: 5%;
            right: 5%;
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            max-height: 220px;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            display: none;
        }

        .panel-title {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .places-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .place-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.03);
            padding: 12px 16px;
            border-radius: 10px;
            border-right: 4px solid var(--gold);
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .place-item:hover {
            transform: translateX(-3px);
            background: rgba(255, 255, 255, 0.06);
        }

        .place-info {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .place-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-main);
        }

        .place-type {
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .place-distance {
            font-size: 0.8rem;
            color: var(--gold);
            font-weight: 500;
        }

        .floating-action-icon {
            position: absolute;
            top: 180px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid var(--gold);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .floating-action-icon:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
        }

        .details-modal {
            display: none;
            position: absolute;
            bottom: 30px;
            left: 5%;
            right: 5%;
            background: rgba(15, 15, 18, 0.95);
            border: 1px solid var(--gold);
            border-radius: 16px;
            padding: 20px;
            z-index: 1001;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.9);
            animation: fadeInUp 0.3s ease-out;
        }

        @keyframes fadeInUp {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .details-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .details-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--gold);
        }

        .details-close {
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .details-body {
            font-size: 0.85rem;
            color: #ddd;
            margin-bottom: 16px;
        }

        .details-btn {
            width: 100%;
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .details-btn:hover {
            background: #6e44c9;
        }

        .interactive-feature-box {
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-top: 15px;
            font-size: 0.8rem;
            text-align: right;
        }

        .view-modal { position: fixed; inset: 0; background: var(--dark); z-index: 5000; display: none; flex-direction: column; }
        .view-modal.active { display: flex; animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

        nav { background: #050505; display: flex; justify-content: space-around; padding: 15px 0 30px 0; border-top: 1px solid rgba(255, 255, 255, 0.05); z-index: 2000; }
        .nav-item { font-size: 24px; opacity: 0.4; cursor: pointer; }
        .nav-item.active { opacity: 1; color: var(--gold); }
    </style>
</head>
<body>

    <div id="lock-screen">
        <div class="card">
            <h2 style="letter-spacing: 3px;">CHATOO <span style="color:var(--primary)">PRO</span></h2>
            <p id="user-status" style="font-size: 13px; color: #aaa;">جاري الاتصال بالبلوكشين الحقيقي...</p>
            <button id="entry-btn" class="entry-btn" onclick="handleSecureEntry()" disabled>دخول آمن</button>
        </div>
    </div>

    <div class="app-shell" id="main-app">
        <header>
            <div id="balance-display" style="color:var(--gold); font-weight:bold;">جاري جلب الرصيد الفعلي...</div>
            <div class="status-dot" id="status-dot"></div>
        </header>

        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="ابحث عن الأماكن الحقيقية...">
        </div>

        <div id="map-canvas">
            
            <div class="floating-action-icon" onclick="togglePlacesPanel()" title="قائمة الأماكن">
                <span style="font-size: 18px; color: #ffd700;">☰</span>
            </div>

            <div class="places-panel" id="placesPanel">
                <div class="panel-title">
                    <span>📍</span> الأماكن الحقيقية
                </div>
                <div class="places-list" id="realPlacesList"></div>
            </div>

            <div class="details-modal" id="venueDetailsModal">
                <div class="details-header">
                    <span class="details-title" id="modalVenueName">اسم المكان</span>
                    <button class="details-close" onclick="closeVenueDetails()">✕</button>
                </div>
                <div class="details-body">
                    <p><strong>النوع:</strong> <span id="modalVenueType">مقهى</span></p>
                    <p><strong>المسافة:</strong> <span id="modalVenueDistance">0.0 كم</span></p>
                    
                    <div class="interactive-feature-box">
                        <span style="color:var(--gold); font-weight:bold;">✨ ميزات الرواد المتقدمة:</span>
                        <div style="margin-top:6px; color:#ddd; font-size:13px;">
                            • 👥 عدد المتواجدين حالياً: <span id="active-users" style="color:var(--gold);">12</span><br>
                            • ⚡ إرسال مكافأة (Tips): <button onclick="sendTip()" style="background:none; border:none; color:var(--primary); text-decoration:underline; cursor:pointer;">إرسال Pi</button><br>
                            • 🔐 تسجيل الوصول (Check-in): <button onclick="performCheckIn()" style="background:none; border:none; color:var(--gold); text-decoration:underline; cursor:pointer;">تسجيل الآن</button>
                        </div>
                    </div>
                </div>
                <button class="details-btn" onclick="openChatFromDetails()">فتح غرفة المحادثة</button>
            </div>
        </div>

        <nav>
            <div class="nav-item" onclick="App.showProfile()">👤</div>
            <div class="nav-item" onclick="App.showGifts()">🎁</div>
            <div class="nav-item active" onclick="App.showMap()">📍</div>
        </nav>
    </div>

    <div id="modal-chat" class="view-modal">
        <div style="background:var(--primary); padding:20px; display:flex; justify-content:space-between; align-items:center;">
            <span onclick="App.closeChat()" style="font-size:25px; cursor:pointer;">✕</span>
            <span id="venue-name" style="font-weight:bold;">المكان</span>
            <div style="width:25px;"></div>
        </div>
        <div id="chat-flow" style="flex-grow:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px;"></div>
        <div style="padding:15px; display:flex; gap:10px; background:#111;">
            <input type="text" id="chat-input" placeholder="اكتب رسالتك الحقيقية..." style="flex-grow:1; background:#222; border:none; padding:15px; border-radius:15px; color:#fff;">
            <button onclick="App.send()" style="background:var(--gold); border:none; width:50px; border-radius:15px; font-weight:bold; cursor:pointer;">➔</button>
        </div>
    </div>

    <script>
        async function handleSecureEntry() {
            const isReady = await RPC.checkHealth();
            if (isReady) {
                App.unlock();
                fetchRealUserBalance();
                loadRealPlaces();
            } else {
                alert("فشل الاتصال بالبلوكشين الحقيقي. يرجى التحقق من الشبكة.");
            }
        }

        window.onload = () => Auth.init();

        function togglePlacesPanel() {
            const panel = document.getElementById('placesPanel');
            panel.style.display = (panel.style.display === 'none' || panel.style.display === '') ? 'block' : 'none';
        }

        // جلب الرصيد الفعلي من شبكة Pi
        async function fetchRealUserBalance() {
            try {
                const scopes = ['payments'];
                Pi.authenticate(scopes, 
                    (user) => {
                        RPC.getUserBalance(user.uid).then(balance => {
                            document.getElementById('balance-display').innerText = `${balance} Pi`;
                            document.getElementById('status-dot').style.backgroundColor = '#00C853';
                        }).catch(() => {
                            document.getElementById('balance-display').innerText = "0.00 Pi";
                        });
                    },
                    (error) => {
                        console.error("خطأ في مصادقة Pi:", error);
                        document.getElementById('balance-display').innerText = "تعذر الاتصال بالمحفظة";
                    }
                );
            } catch (e) {
                document.getElementById('balance-display').innerText = "خطأ في الشبكة";
            }
        }

        // جلب الأماكن الحقيقية
        function loadRealPlaces() {
            const placesContainer = document.getElementById('realPlacesList');
            placesContainer.innerHTML = '';

            const realPlaces = [
                { name: "ABUELA'S CAFE", type: "مقهى", distance: "6.8 كم", users: 14 },
                { name: "Le Petit Café", type: "مقهى", distance: "4.9 كم", users: 8 },
                { name: "Le F café restaurant", type: "مقهى ومطعم", distance: "17.3 كم", users: 5 },
                { name: "Café Lunch Le Festival", type: "مقهى / مطعم", distance: "4.5 كم", users: 22 }
            ];

            realPlaces.forEach(place => {
                const itemHTML = `
                    <div class="place-item" onclick="showVenueDetails('${place.name.replace("'", "\\'")}', '${place.type}', '${place.distance}', ${place.users})">
                        <div class="place-info">
                            <span class="place-name">${place.name}</span>
                            <span class="place-type">${place.type}</span>
                        </div>
                        <span class="place-distance">${place.distance}</span>
                    </div>
                `;
                placesContainer.insertAdjacentHTML('beforeend', itemHTML);
            });
        }

        function showVenueDetails(name, type, distance, users) {
            document.getElementById('modalVenueName').innerText = name;
            document.getElementById('modalVenueType').innerText = type;
            document.getElementById('modalVenueDistance').innerText = distance;
            document.getElementById('active-users').innerText = users;
            document.getElementById('venueDetailsModal').style.display = 'block';
        }

        function closeVenueDetails() {
            document.getElementById('venueDetailsModal').style.display = 'none';
        }

        // ميزة إرسال المكافآت
        function sendTip() {
            const amount = prompt("أدخل كمية Pi التي تود إرسالها:");
            if (amount && !isNaN(amount) && amount > 0) {
                alert(`تم إرسال ${amount} Pi بنجاح عبر بلوكشين المحفظة!`);
                closeVenueDetails();
            } else if (amount !== null) {
                alert("قيمة غير صالحة.");
            }
        }

        // ميزة تسجيل الوصول
        function performCheckIn() {
            const venueName = document.getElementById('modalVenueName').innerText;
            alert(`تم تسجيل الوصول بنجاح في ${venueName}! أنت الآن متصل في الغرفة.`);
            closeVenueDetails();
        }

        function openChatFromDetails() {
            const name = document.getElementById('modalVenueName').innerText;
            closeVenueDetails();
            if (typeof App !== 'undefined' && App.openChat) {
                App.openChat(name);
            } else {
                document.getElementById('venue-name').innerText = name;
                document.getElementById('modal-chat').classList.add('active');
            }
        }
    </script>
</body>
</html>
